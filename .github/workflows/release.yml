# Manual release only. Do not auto-publish on push to main.
#
# Prerequisites before the first successful CI publish:
# 1. Human bootstrap npm publish (OTP) — must not collide with semantic-release tags
# 2. Configure npm Trusted Publisher (OIDC) for this workflow path
# 3. Green `main` CI
#
# Until then: do not run this workflow expecting a publish.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: semantic-release
    if: github.repository == 'invertase/react-native-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      actions: read # inspect exact-SHA CI result
      contents: write # git tags + GitHub Releases
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Admin PAT (repo secret GH_TOKEN) so @semantic-release/git can push the
          # version + CHANGELOG commit past main's branch protection — same pattern
          # as invertase/react-native-google-mobile-ads and react-native-firebase.
          token: ${{ secrets.GH_TOKEN }}

      - name: Git identity for the release commit
        run: |
          git config user.name 'Invertase Publisher'
          git config user.email 'oss@invertase.io'

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      - name: Require successful exact-SHA CI
        # Waits up to 120 minutes for a completed ci.yml run on this dispatch SHA.
        # Failure and cancellation conclusions fail the release.
        run: bash scripts/ci/wait-for-ci.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        run: yarn semantic-release
        env:
          # Admin PAT (repo secret) for both GitHub Releases AND the
          # @semantic-release/git commit-back push past branch protection.
          # No NPM_TOKEN: OIDC trusted publishing after first human publish + Trusted Publisher setup.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # Avoid setup-node writing an .npmrc that breaks OIDC (semantic-release docs).
          NPM_CONFIG_PROVENANCE: 'true'
          # @semantic-release/npm runs `npm version`; in a Yarn workspaces monorepo
          # npm cannot parse `workspace:` protocols when relinking. Only bump the
          # version field. (Matches RNGMA's publish workflow.)
          npm_config_workspaces_update: 'false'
