# PR title must be Conventional Commits.
# Squash merges use the PR title as the release commit message for semantic-release.
name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        # https://github.com/amannn/action-semantic-pull-request/releases
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # When a PR is a single commit, also require that commit to be conventional.
          validateSingleCommit: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must not start with an uppercase letter
            (conventional commits use lowercase subjects, e.g. "feat: add assert command").
