name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build package
        run: yarn prepare

      - name: CLI help smoke
        run: node bin/rn-coverage.js --help

  # Primary: bare RN + USE_FRAMEWORKS=dynamic → CoverageFixture.framework +
  # non-zero fixture LCOV. Expo cannot host this cell (React-Core force-static).
  e2e-ios-dynamic:
    name: e2e / iOS dynamic (primary)
    runs-on: macos-15
    needs: unit
    timeout-minutes: 90
    env:
      CELL: dynamic
      IOS_DEVICE_NAME: iPhone 16
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: CocoaPods
        run: gem install cocoapods -N || true

      - name: Appium e2e + coverage assert
        run: yarn e2e:ios:dynamic

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-ios-dynamic
          path: |
            artifacts/e2e/coverage/dynamic/**
            artifacts/e2e/logs/dynamic/**
          if-no-files-found: warn

  # Expo example: staticlib merge (honest static cell). Still asserts fixture hits.
  e2e-ios-static:
    name: e2e / iOS static (Expo)
    runs-on: macos-15
    needs: unit
    timeout-minutes: 90
    env:
      CELL: static
      IOS_DEVICE_NAME: iPhone 16
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Ensure Expo prebuild
        run: |
          yarn prepare
          yarn workspace react-native-coverage-example exec expo prebuild --platform ios --no-install

      - name: Appium e2e + coverage assert
        run: yarn e2e:ios:static

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-ios-static
          path: |
            artifacts/e2e/coverage/static/**
            artifacts/e2e/logs/static/**
          if-no-files-found: warn

  e2e-android:
    name: e2e / Android (Expo)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b017243d6 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ensure Expo Android prebuild
        run: |
          yarn prepare
          yarn workspace react-native-coverage-example exec expo prebuild --platform android --no-install

      - name: Android Appium e2e + Jacoco assert
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e0361f22 # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          script: yarn e2e:android

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-android
          path: |
            artifacts/e2e/coverage/android/**
            artifacts/e2e/logs/android/**
          if-no-files-found: warn
