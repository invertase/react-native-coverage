name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Expo SDK 57 requires Xcode 26.4+; macos-26 + latest-stable matches RNFB iOS e2e style.
  XCODE_VERSION: latest-stable
  # Xcode 26.6 / macos-26 ships iPhone 17* devices (no plain iPhone 16). Matches RNFB.
  IOS_DEVICE_NAME: iPhone 17

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:coverage

      - name: Build package
        run: yarn prepare

      - name: CLI help smoke
        run: node bin/rn-coverage.js --help

      - name: Upload unit coverage (Codecov)
        if: always()
        # https://github.com/codecov/codecov-action/releases
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: coverage/unit/lcov.info
          flags: unit-js
          name: unit-js
          fail_ci_if_error: false

  # Primary: bare RN + USE_FRAMEWORKS=dynamic → CoverageFixture.framework +
  # non-zero fixture LCOV. Expo cannot host this cell (React-Core force-static).
  e2e-ios-dynamic:
    name: e2e / iOS dynamic (primary)
    runs-on: macos-26
    needs: unit
    timeout-minutes: 90
    env:
      CELL: dynamic
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # https://github.com/maxim-lobanov/setup-xcode/releases
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Xcode / simulator diagnostics
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-}"
          xcodebuild -version
          xcrun swiftc --version
          # Listing sims reduces intermittent "destination unavailable" flakes
          # (same pattern as RNFB tests_e2e_ios.yml).
          xcrun simctl list

      - name: CocoaPods
        run: gem install cocoapods -N || true

      - name: Appium e2e + coverage assert
        run: yarn e2e:ios:dynamic

      - name: Upload coverage artifacts
        if: always()
        # https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ios-dynamic
          path: |
            artifacts/e2e/coverage/dynamic/**
            artifacts/e2e/logs/dynamic/**
          if-no-files-found: warn

      - name: Upload to Codecov
        if: always()
        # https://github.com/codecov/codecov-action/releases
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: artifacts/e2e/coverage/dynamic/lcov.info,artifacts/e2e/coverage/dynamic/js/lcov.info
          flags: e2e-ios-dynamic
          name: e2e-ios-dynamic
          fail_ci_if_error: false

  # Expo example: staticlib merge (honest static cell). Still asserts fixture hits.
  e2e-ios-static:
    name: e2e / iOS static (Expo)
    runs-on: macos-26
    needs: unit
    timeout-minutes: 90
    env:
      CELL: static
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # https://github.com/maxim-lobanov/setup-xcode/releases
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Xcode / simulator diagnostics
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-}"
          xcodebuild -version
          xcrun swiftc --version
          xcrun simctl list

      - name: Ensure Expo prebuild
        run: |
          yarn prepare
          yarn workspace react-native-coverage-example exec expo prebuild --platform ios --no-install

      - name: Appium e2e + coverage assert
        run: yarn e2e:ios:static

      - name: Upload coverage artifacts
        if: always()
        # https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ios-static
          path: |
            artifacts/e2e/coverage/static/**
            artifacts/e2e/logs/static/**
          if-no-files-found: warn

      - name: Upload to Codecov
        if: always()
        # https://github.com/codecov/codecov-action/releases
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: artifacts/e2e/coverage/static/lcov.info,artifacts/e2e/coverage/static/js/lcov.info
          flags: e2e-ios-static
          name: e2e-ios-static
          fail_ci_if_error: false

  e2e-android:
    name: e2e / Android (Expo)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Java
        # https://github.com/actions/setup-java/releases
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ensure Expo Android prebuild
        run: |
          yarn prepare
          yarn workspace react-native-coverage-example exec expo prebuild --platform android --no-install

      - name: Android Appium e2e + Jacoco assert
        # https://github.com/ReactiveCircus/android-emulator-runner/releases
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: yarn e2e:android

      - name: Upload coverage artifacts
        if: always()
        # https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-android
          path: |
            artifacts/e2e/coverage/android/**
            artifacts/e2e/logs/android/**
          if-no-files-found: warn

      - name: Upload to Codecov
        if: always()
        # https://github.com/codecov/codecov-action/releases
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: artifacts/e2e/coverage/android/jacocoTestReport.xml,artifacts/e2e/coverage/android/js/lcov.info
          flags: e2e-android
          name: e2e-android
          fail_ci_if_error: false
